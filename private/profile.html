<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1><i>Profile Page</i></h1>
    <form onsubmit="handleAdd(event)">
    <input type="text" name="num1">
    <input type="text" name="num2">
    <button type="submit">Add</button>
    <b id="res"></b>
    </form>
    <script>
        const handleAdd=(ev)=>{
            fetch("/add",{
                method:"POST",
                headers:{
                    "token":window.localStorage.getItem("token")
                },
                body:JSON.stringify({a:ev.target.num1,b:ev.target.num2})
            })
            .then(res=>res.json())
            .then(data=>document.getElementById("res").innerText=`Result:${data.result}`)
        }
    </script>
</body>
</html>
